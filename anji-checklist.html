<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>安吉必带清单</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: "SF Mono", "JetBrains Mono", Consolas, "PingFang SC", "Microsoft YaHei", monospace, sans-serif;
    background: #05070d; color: #d7e6f5; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -2;
    background: url('anji-bg.jpg') center center / cover no-repeat; }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,229,255,.10), transparent),
      linear-gradient(rgba(0,229,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,.05) 1px, transparent 1px),
      linear-gradient(180deg, rgba(5,7,13,.78), rgba(5,7,13,.88));
    background-size: 100% 100%, 34px 34px, 34px 34px, 100% 100%; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 26px 16px 52px; }
  .kicker { font-size: 11px; letter-spacing: 4px; color: #00e5ff; text-transform: uppercase; margin-bottom: 6px; }
  h1 { font-size: 26px; margin: 0 0 4px; font-weight: 800; letter-spacing: 2px; color: #f2faff;
    text-shadow: 0 0 18px rgba(0,229,255,.55), 0 0 2px rgba(0,229,255,.8); }
  .sub { color: #7d93a8; font-size: 12.5px; margin-bottom: 8px; letter-spacing: .5px; }
  .prog { font-size: 15px; font-weight: 700; color: #00e5ff; margin: 14px 0 6px; letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(0,229,255,.5); }
  .bar { height: 8px; background: rgba(0,229,255,.08); border: 1px solid rgba(0,229,255,.25); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
  .bar > div { height: 100%; width: 0%; background: linear-gradient(90deg, #0077ff, #00e5ff);
    box-shadow: 0 0 12px rgba(0,229,255,.8); transition: width .25s; }
  .group { font-size: 13px; font-weight: 700; color: #ff2ea6; margin: 22px 0 8px; letter-spacing: 3px;
    text-shadow: 0 0 10px rgba(255,46,166,.45); }
  .group::before { content: "▸ "; color: #00e5ff; }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px; margin-bottom: 8px; cursor: pointer;
    background: linear-gradient(180deg, rgba(13,22,38,.92), rgba(8,13,24,.92));
    border: 1px solid rgba(0,229,255,.18); border-left: 3px solid rgba(0,229,255,.45); border-radius: 6px; }
  .row:active { border-color: rgba(0,229,255,.6); }
  .box { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 4px; border: 2px solid rgba(0,229,255,.5);
    display: flex; align-items: center; justify-content: center; font-size: 17px; color: #04121a; font-weight: 900; }
  .row.done { border-left-color: #00e5ff; }
  .row.done .box { background: #00e5ff; border-color: #00e5ff; box-shadow: 0 0 12px rgba(0,229,255,.75); }
  .row.done .label { color: #5f7488; text-decoration: line-through; }
  .label { font-size: 16px; letter-spacing: .5px; }
  .tag { margin-left: auto; flex: 0 0 auto; font-size: 11.5px; color: #8fd8e8; border: 1px solid rgba(0,229,255,.3);
    border-radius: 3px; padding: 2px 8px; letter-spacing: .5px; }
  .reset { display: block; margin: 30px auto 0; background: transparent; border: 1px solid rgba(255,46,166,.55); color: #ff7ac2;
    border-radius: 4px; padding: 10px 26px; font-size: 14px; letter-spacing: 2px; cursor: pointer; font-family: inherit; }
  .reset:active { background: rgba(255,46,166,.12); }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">// Mission Loadout · Anji</div>
  <h1>安吉必带清单</h1>
  <div class="sub">2026-11-18 出发 · 目远山舍 · 装一样点一下打勾，勾选存在本机浏览器里</div>
  <div class="prog" id="prog"></div>
  <div class="bar"><div id="barfill"></div></div>
  <div id="list"></div>
  <button class="reset" id="reset">清空重勾</button>
</div>
<script>
  var ITEMS = [
    { g: "你点名要提醒的", items: [["mosquito","防蚊液",""],["towel","浴巾",""],["pillow","枕头",""],["dogfood","狗粮","三天的量"],["dogbowl","狗喝水的盆",""]] },
    { g: "个人必备", items: [["idcard","身份证",""],["charger","手机充电器",""],["downcoat","厚羽绒服（自己+爸妈）","早晚冷"],["umbrella","雨伞","明早有阵雨"],["nose","洗鼻器 + 鼻喷剂",""],["yitiaogen","一条根","腿酸用"],["carsick","晕车药",""],["clothes","换洗衣物","两晚"],["swim","私汤泳衣",""]] },
    { g: "狗黑豆的", items: [["leash","牵引绳","必须牵绳"],["poopbag","拾便袋",""],["dogbed","狗垫子/窝",""],["peepad","尿垫",""]] },
    { g: "出发前", items: [["charge","车今晚充满电","往返285km"],["leg","明早腿震一轮再出门",""]] }
  ];
  var KEY = "anji-checklist-v1";
  var checked = {};
  try { checked = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { checked = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(checked)); } catch (e) {} }
  function render() {
    var total = 0, done = 0, html = "";
    ITEMS.forEach(function (grp) {
      html += '<div class="group">' + grp.g + "</div>";
      grp.items.forEach(function (it) {
        total++;
        var on = !!checked[it[0]];
        if (on) done++;
        html += '<div class="row' + (on ? " done" : "") + '" data-id="' + it[0] + '">'
          + '<div class="box">' + (on ? "✓" : "") + "</div>"
          + '<div class="label">' + it[1] + "</div>"
          + (it[2] ? '<div class="tag">' + it[2] + "</div>" : "")
          + "</div>";
      });
    });
    document.getElementById("list").innerHTML = html;
    document.getElementById("prog").textContent = "已装 " + done + " / " + total;
    document.getElementById("barfill").style.width = (total ? Math.round(done / total * 100) : 0) + "%";
  }
  document.getElementById("list").addEventListener("click", function (ev) {
    var row = ev.target;
    while (row && !(row.classList && row.classList.contains("row"))) row = row.parentElement;
    if (!row) return;
    var id = row.getAttribute("data-id");
    checked[id] = !checked[id];
    save();
    render();
  });
  document.getElementById("reset").addEventListener("click", function () {
    checked = {};
    save();
    render();
  });
  render();
</script>
</body>
</html>
